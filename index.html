<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Routine Monsters Preview</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- React & ReactDOM を CDN から読み込む -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel Standalone（JSX をブラウザで変換するため） -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- JSX ファイルを読み込む -->
    <!-- RoutineMonsters.jsx がリポジトリの root にある前提 -->
    <script type="text/babel" src="./RoutineMonsters.jsx"></script>
  </body>
</html>
